<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — The Sewing Studio</title>
  </head>
  <body>
    <!-- Disable Sveltia CMS draft backups (IndexedDB). Merges into the existing
         preferences so the stored auth token and theme are preserved, and makes
         sure stale editor state can never overwrite content pushed from git. -->
    <script>
      try {
        const KEY = "sveltia-cms.prefs";
        const prefs = JSON.parse(localStorage.getItem(KEY) || "{}");
        prefs.useDraftBackup = false;
        localStorage.setItem(KEY, JSON.stringify(prefs));
      } catch {}
    </script>
    <!-- Sveltia CMS: lightweight, Git-based CMS targeting Decap-compatible config.yml.
         Version pinned so CMS behaviour cannot change between releases. -->
    <script src="https://unpkg.com/@sveltia/cms@0.201.1/dist/sveltia-cms.js"></script>
  </body>
</html>

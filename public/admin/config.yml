# Sveltia / Decap CMS Configuration for The Sewing Studio
backend:
  name: github
  repo: phoebeogorman/sewing-studio-web
  branch: main
  base_url: https://sveltia-cms-auth.uo270394.workers.dev

local_backend: true

media_folder: src/assets/images
public_folder: /images

collections:
  - name: pages
    label: Pages
    files:
      - name: home_en
        label: English Home Page
        file: src/content/home/en.json
        fields:
          - name: metaTitle
            label: Meta Title
            widget: string

          - name: metaDescription
            label: Meta Description
            widget: text

          - name: blocks
            label: Page Blocks
            widget: list
            typeKey: type
            summary: "{{fields.title}} ({{fields.type}})"
            types:
              # --- HERO BLOCK ----------------------------------------------------
              - name: hero
                label: Hero Section
                widget: object
                summary: "Hero: {{fields.title}}"
                fields:
                  - name: type
                    widget: hidden
                    default: hero
                  - name: id
                    label: Anchor ID
                    widget: string
                    default: hero
                  - name: kicker
                    label: Kicker
                    widget: string
                  - name: title
                    label: Title
                    widget: string
                  - name: tagline
                    label: Tagline
                    widget: string
                  - name: intro
                    label: Intro
                    widget: text
                  - name: image
                    label: Image
                    widget: object
                    fields:
                      - name: src
                        label: Image
                        widget: image
                      - name: alt
                        label: Alt Text
                        widget: string
                        required: false
                        default: ""
                  - name: ctaPrimaryLabel
                    label: Primary Button
                    widget: string
                  - name: ctaSecondaryLabel
                    label: Secondary Button
                    widget: string
                  - name: ctaSecondaryTarget
                    label: Target
                    widget: string

              # --- TEXT + MEDIA (CAROUSEL) BLOCK ----------------------------------
              - name: text-media
                label: Section with Gallery Carousel
                widget: object
                summary: "Carousel: {{fields.title}} (#{{fields.id}})"
                fields:
                  - name: type
                    widget: hidden
                    default: text-media
                  - name: id
                    label: Section ID
                    widget: string
                  - name: navLabel
                    label: Nav Label
                    widget: string
                    required: false
                  - name: kicker
                    label: Kicker
                    widget: string
                  - name: title
                    label: Title
                    widget: string
                  - name: lead
                    label: Lead Subtitle
                    widget: string
                    required: false
                  - name: body
                    label: Body Copy
                    widget: text
                  - name: gallery
                    label: Gallery Images
                    widget: list
                    summary: "{{fields.src}}"
                    fields:
                      - name: src
                        label: Image
                        widget: image
                      - name: alt
                        label: Alt Text
                        widget: string
                        required: false
                        default: ""
                  - name: mediaSide
                    label: Image Side
                    widget: select
                    options:
                      - label: "Right side (default)"
                        value: end
                      - label: "Left side (reversed)"
                        value: start
                    default: end
                  - name: surface
                    label: Background Colour
                    widget: select
                    options:
                      - label: "Page background (light cream)"
                        value: page
                      - label: "Surface background (warm cream)"
                        value: cream
                    default: page
                  - name: numbered
                    label: "Show section number (01, 02...)"
                    widget: boolean
                    default: false

              # --- TEXT + SINGLE IMAGE BLOCK --------------------------------------
              - name: text-image
                label: Section with Single Photo
                widget: object
                summary: "Photo: {{fields.title}} (#{{fields.id}})"
                fields:
                  - name: type
                    widget: hidden
                    default: text-image
                  - name: id
                    label: Section ID
                    widget: string
                  - name: navLabel
                    label: Nav Label
                    widget: string
                    required: false
                  - name: kicker
                    label: Kicker
                    widget: string
                  - name: title
                    label: Title
                    widget: string
                  - name: body
                    label: Body Copy
                    widget: text
                  - name: image
                    label: Photo
                    widget: object
                    fields:
                      - name: src
                        label: Image
                        widget: image
                      - name: alt
                        label: Alt Text
                        widget: string
                        required: false
                        default: ""
                  - name: mediaSide
                    label: Photo Side
                    widget: select
                    options:
                      - label: "Left side (default)"
                        value: start
                      - label: "Right side (reversed)"
                        value: end
                    default: start
                  - name: surface
                    label: Background Colour
                    widget: select
                    options:
                      - label: "Page background"
                        value: page
                      - label: "Cream surface"
                        value: cream
                    default: page

              # --- TEXT ONLY BLOCK ------------------------------------------------
              - name: text
                label: Text Only Section
                widget: object
                summary: "Text: {{fields.title}} (#{{fields.id}})"
                fields:
                  - name: type
                    widget: hidden
                    default: text
                  - name: id
                    label: Section ID
                    widget: string
                  - name: navLabel
                    label: Nav Label
                    widget: string
                    required: false
                  - name: kicker
                    label: Kicker
                    widget: string
                    required: false
                  - name: title
                    label: Title
                    widget: string
                  - name: body
                    label: Body Copy
                    widget: text
                  - name: surface
                    label: Background Colour
                    widget: select
                    options:
                      - label: "Page background"
                        value: page
                      - label: "Cream surface"
                        value: cream
                    default: page

